server:
  port: 8088

spring:
  application:
    name: math-server-mcp
  ai:
    mcp:
      server:
        enabled: true
        name: math-server-mcp
        version: 1.0.0
        sse-endpoint: /api/sse
        sse-message-endpoint: /api/sse
        capabilities:
          tool: true

logging:
  level:
    io.modelcontextprotocol: TRACE
    org.springframework.ai.mcp: TRACE
    com.et.ai: TRACE
    org.springframework: INFO
    org.springframework.web: DEBUG
    org.springframework.http: DEBUG
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log